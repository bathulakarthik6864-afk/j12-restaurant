<title>J12 Restaurant – Vizianagaram</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@400;500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#060b1a;--panel:#0a1230;--card:#0d1838;--line:#1f2f66;--ink:#f6f1e4;--mut:#a9b4d4;--or:#ffb81c;--or2:#f08a00;box-sizing:border-box}
*{box-sizing:border-box}html{scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "DM Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0;line-height:1.1}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
#side{position:fixed;left:0;top:0;bottom:0;width:224px;background:var(--panel);border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;display:flex;flex-direction:column;overflow:auto;z-index:6}
.logo{text-align:center;margin-bottom:22px}.logo{user-select:none;-webkit-user-select:none}.logo img{display:block;width:100%;max-width:172px;height:auto;margin:0 auto}.logo b{font:700 54px/1 "Playfair Display",serif;display:block}.logo small{letter-spacing:.35em;font-size:11px;color:var(--mut)}
#side nav button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:var(--ink);font:inherit;padding:11px 14px;border-radius:10px;cursor:pointer;text-align:left;margin-bottom:4px}
#side nav button[aria-current="page"]{background:linear-gradient(90deg,var(--or2),var(--or));color:#0a1230;font-weight:700}
.soc{display:flex;gap:18px;padding:18px 14px;font-size:18px}.soc a{text-decoration:none}
.script{font:600 28px/1.15 "Dancing Script",cursive;color:var(--or);margin-top:auto;padding:14px;transform:rotate(-6deg)}
#main{margin-left:224px;padding:18px 26px 110px;min-height:100vh}
.top{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.top input.s{flex:0 1 450px;border-radius:999px;padding:12px 20px;background:var(--panel)}
.chip{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--ink)}.prof{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:18px}
input,textarea,select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#070c1f;color:var(--ink);width:100%}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.btn{display:inline-flex;gap:8px;align-items:center;background:linear-gradient(180deg,#ffd25a,var(--or));color:#0a1230;padding:11px 24px;border-radius:999px;border:0;cursor:pointer;font:inherit;font-weight:700}
.btn.ol{background:none;color:var(--or);border:1px solid var(--or);padding:6px 18px;font-size:13px}.btn.sm{padding:6px 14px;font-size:13px}.btn.del{background:#b3342a;color:#fff}
.hero{position:relative;min-height:340px;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 78% 40%,#1c3a8c,#070c1f 62%);background-size:cover;background-position:center;padding:34px 34px 30px;margin-bottom:14px;display:flex;flex-direction:column;justify-content:center}
.hero.has::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#060b1a 15%,rgba(6,11,26,.1) 80%)}
.hero>*{position:relative}.eb{letter-spacing:.3em;color:var(--or);font-size:12px;margin-bottom:16px}
.hero h1{font-size:clamp(40px,6vw,66px);font-weight:500;max-width:9em}.hero h1 em{color:var(--or);font-style:normal}
.hero p{max-width:26em;font-size:17px;margin:14px 0 22px}.big{position:absolute!important;right:6%;bottom:8%;font-size:170px;opacity:.9;filter:drop-shadow(0 10px 30px #000)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:26px}
.cat{height:92px;border:1px solid var(--line);border-radius:12px;background:var(--card) center/cover;color:var(--ink);cursor:pointer;text-align:left;padding:10px;font:inherit;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.cat.has::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,11,26,.94) 0%,rgba(6,11,26,.6) 45%,rgba(6,11,26,.1) 100%)}.cat>*{position:relative}.cat span{font-size:22px;color:var(--or);text-shadow:0 2px 6px #000}.cat b{font-size:16px;font-weight:700;color:#fff;text-shadow:0 2px 8px #000,0 0 3px #000}
.dc.na{opacity:.62}.dc.na .im{filter:grayscale(1)}.nab{position:absolute;left:8px;right:8px;top:44px;z-index:2;text-align:center;background:rgba(179,52,42,.95);color:#fff;font-weight:700;font-size:13px;padding:5px 8px;border-radius:8px}.nab2{color:#ff8a7a;font-weight:700;font-size:13px;text-align:right;max-width:120px}.orow.na{opacity:.7}
.cat[aria-selected="true"]{border-color:var(--or);box-shadow:0 0 0 1px var(--or)}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:10px}.hd h2{font-size:30px}.hd h2 em{color:var(--or);font-style:normal}.hd p{margin:4px 0 0;color:var(--mut)}
.link{background:none;border:0;color:var(--or);cursor:pointer;font:inherit}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:26px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.im{height:112px;background:center/cover #14214a}.im.ph{display:flex;align-items:center;justify-content:center;font-size:52px}
.bd{position:absolute;top:8px;left:8px;background:var(--or);color:#0a1230;font-size:12px;font-weight:700;padding:2px 10px;border-radius:6px}
.dc .b{padding:12px 14px 14px}.dc h3{font:700 17px "DM Sans"}.dc p{margin:3px 0 10px;color:var(--mut);font-size:13.5px;min-height:40px}
.pr{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px}
.dot{display:inline-block;width:10px;height:10px;border:2px solid;margin-right:6px;position:relative}.dot::after{content:"";position:absolute;inset:1.5px;border-radius:50%;background:currentColor}.v{color:#37b35a}.n{color:#d9473a}
.bn{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bnr{min-height:170px;border:1px solid var(--or2);border-radius:14px;padding:22px 26px;background:linear-gradient(110deg,#0c1638 40%,#1d3270) center/cover;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:8px}
.bnr.has::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,11,26,.92) 30%,rgba(6,11,26,.15))}.bnr>*{position:relative}.bnr h2{font-size:30px}.bnr p{margin:0;color:var(--mut)}
.bnr.light{background-color:#fff3d1;color:#0a1230;border-color:#fff3d1}.bnr.light.has::before{background:linear-gradient(90deg,rgba(241,230,210,.96) 35%,rgba(241,230,210,0))}.bnr.light p{color:#33406b}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.g{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:#14214a center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;font:inherit;padding:8px}.g span{font-size:52px}.g small{font-weight:700;text-shadow:0 1px 5px #000}
#gate{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 30%,#1c3a8c,#060b1a 65%);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}#gate.on{display:flex}.gc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:400px;display:grid;gap:12px;text-align:center}.gc img{max-width:150px;margin:0 auto;display:block}.gc label{text-align:left}.gc .btn{justify-content:center}.gc .lk{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;text-decoration:underline;padding:4px}#usr{display:flex;gap:6px;align-items:center}
#splash{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 40%,#1c3a8c,#060b1a 70%);display:none;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}#splash.on,#splash.out{display:flex}#splash.out{animation:sfade .6s forwards}.sp{text-align:center;display:grid;gap:18px;justify-items:center}.sp img{width:min(260px,60vw);animation:pop 1s cubic-bezier(.2,.9,.3,1.2) both,glow 2s ease-in-out .9s infinite alternate}.sp h1{font-size:72px}.spt{letter-spacing:.3em;font-size:12px;color:var(--or);opacity:0;animation:fin .8s .8s forwards}.spb{width:160px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}.spb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--or2),#ffd25a);animation:ld 2.2s ease-in-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}@keyframes glow{from{filter:drop-shadow(0 0 0 rgba(255,184,28,0))}to{filter:drop-shadow(0 0 26px rgba(255,184,28,.55))}}@keyframes fin{to{opacity:1}}@keyframes ld{to{width:100%}}@keyframes sfade{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.sp img,.spt,.spb i{animation-duration:.01s;animation-delay:0s}}
.cartbar{position:sticky;bottom:12px;background:var(--panel);border:1px solid var(--or);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;z-index:4}
.orow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}.orow .t{flex:1}.orow h3{font:700 16px "DM Sans"}.orow p{margin:0;color:var(--mut);font-size:13px}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--or);background:none;color:var(--or);font-size:20px;cursor:pointer}.qty b{min-width:20px;text-align:center}
.tbn{display:inline-block;background:var(--or);color:#0a1230;font:700 34px "Playfair Display",serif;padding:4px 20px;border-radius:12px}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start}.oc.new{border-color:var(--or)}
.nb{background:#d9473a;color:#fff;border-radius:999px;padding:0 8px;font-size:12px;margin-left:auto}.err{color:#ff8a7a;margin:0}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
@media print{.noprint{display:none!important}body.pk>*:not(#gate){display:none!important}body.pk #gate{display:flex!important;position:static;background:#fff;color:#000}body.pk .gc{background:#fff;color:#000;border:0;max-width:320px}}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center;padding:20px}#lb.on{display:flex}#lb img{max-width:92%;max-height:80%;border-radius:10px}#lb div{font-size:110px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px;max-width:540px;margin-bottom:20px}
.ed{background:var(--card);border:1px dashed var(--or);border-radius:12px;padding:12px;display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:100px}.row .btn,.row .ck{flex:0 0 auto}.ck{display:flex;gap:6px;align-items:center;color:var(--ink);font-size:13px}.ck input{width:auto}
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:20px}.rv>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.st{color:var(--or);letter-spacing:2px}
.th{width:90px;height:64px;object-fit:cover;border-radius:8px}
#bar{position:fixed;left:224px;right:0;bottom:0;background:var(--or);color:#0a1230;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:none;gap:14px;align-items:center;justify-content:center;z-index:9}#bar.on{display:flex}#bar .btn{background:#fff;color:#0a1230}
@media (max-width:820px){#side{position:static;width:auto;flex-direction:column;border-right:0;border-bottom:1px solid var(--line);padding-bottom:6px}.logo{margin-bottom:8px}.logo b{font-size:38px}.logo img{max-width:96px}#side nav{display:flex;overflow-x:auto;gap:4px}#side nav button{width:auto;white-space:nowrap}.script,.soc{display:none}#main{margin:0;padding:14px 14px 110px}#bar{left:0}.bn{grid-template-columns:1fr}.big{font-size:90px}.hero{padding:24px 20px}}

 a.sort(function(x,y){return y.t-x.t});var sig=JSON.stringify(a);if(sig===ordSig)return;ordSig=sig;orders=a;var n=newCount();if(loadedOnce&&n>lastNew)beep();lastNew=n;loadedOnce=true;side();if(tab==='orders')render()}catch(e){}}

function ordSet(){var s=S.site;return '<div class="box noprint" style="max-width:none;margin-top:24px"><h3>Live website and order settings</h3><div class="row"><label>Restaurant WhatsApp (receives orders), with country code<input data-s="wa" value="'+att(s.wa)+'" placeholder="91XXXXXXXXXX"></label><label>Kitchen WhatsApp (for KOT)<input data-s="kitchenWa" value="'+att(s.kitchenWa)+'" placeholder="91XXXXXXXXXX"></label></div><div class="row"><label>Firebase Database URL<input data-s="fbUrl" value="'+att(s.fbUrl||s.ordersUrl)+'" placeholder="https://your-project-default-rtdb.firebaseio.com"></label><label>Firebase Web API key<input data-s="fbKey" value="'+att(s.fbKey)+'" placeholder="AIza..."></label></div>'+(ordUrl()&&fbTok?'<div class="row"><button class="btn" data-a="pushnow">Publish all changes to the live website</button></div>':'')+'<small style="color:var(--mut)">With both Firebase values set, admin login uses your Firebase admin email and password, and every Save updates the live website for everyone. Press Save, then Download updated file and deploy it once after changing these.</small></div>'}

 var a=t.dataset.a,o=target(t);

 if(a==='oagain'){ord.step='pick';ord.done=null;ord.err='';return render()}
 if(a==='ofl'){ofl=t.dataset.n;return render()}
 if(a==='kot'){setStatus(t.dataset.k,'kitchen');return showKot(t.dataset.k)}
 if(a==='kotv')return showKot(t.dataset.k);
 if(a==='served')return setStatus(t.dataset.k,'served');

 if(a==='again'){booked=null;return render()}

 if(a==='cdel'){var c=S.cats[t.closest('[data-ci]').dataset.ci];S.cats.splice(t.closest('[data-ci]').dataset.ci,1);if(cat===c.n)cat='';mark();return render()}
 if(a==='simg'){var k=t.dataset.k;pick=function(u){S.site[k]=u;mark();render()};return $('file').click()}

 if(a==='gdel'){S.gallery.splice(t.dataset.i,1);mark();return render()}
 if(a==='rdel'){S.reviews.splice(t.dataset.i,1);mark();return render()}});

 if(el.id==='q'){qs=el.value.trim().toLowerCase();if(tab!=='menu'){tab='menu';side()}return render()}
